name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # 3.8 is what the README promises: pinned to 22.04, the newest
          # image that still provisions it
          - python-version: "3.8"
            os: ubuntu-22.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  # the two installer packages must keep building and keep carrying every
  # skill folder: this job is the proof, on every push
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and install it into a throwaway prefix
        run: |
          pip install build
          python -m build --wheel
          pip install --prefix /tmp/try dist/*.whl
          /tmp/try/bin/trader-skill --version
          /tmp/try/bin/trader-skill list
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pack the npm tarball and try its installer
        run: |
          npm pack --dry-run
          npm pack
          tar -xzf trader-skill-*.tgz
          node package/bin/cli.js --list
